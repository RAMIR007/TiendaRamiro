<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | RX Store Demo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0d14">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3ERX%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-screen">
    <div class="login-card">
      <div class="login-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h2>Restablecer contraseña</h2>
      <p id="resetIntro">Elige una contraseña nueva para tu cuenta.</p>
      <p id="resetEmail" class="reset-email"></p>

      <form id="resetForm" hidden>
        <div class="form-group">
          <label for="resetPassword">Nueva contraseña</label>
          <input type="password" id="resetPassword" class="form-control" minlength="8"
            autocomplete="new-password" required placeholder="Mínimo 8 caracteres">
        </div>
        <div class="form-group">
          <label for="resetConfirm">Repetir contraseña</label>
          <input type="password" id="resetConfirm" class="form-control" minlength="8"
            autocomplete="new-password" required placeholder="Repite la contraseña">
        </div>
        <button type="submit" id="resetSubmit" class="btn btn-primary login-submit">Guardar contraseña</button>
      </form>

      <div id="resetSuccess" hidden>
        <p class="login-notice">Contraseña actualizada correctamente.</p>
        <a class="btn btn-primary login-submit" href="/admin.html">Ir al panel</a>
      </div>

      <div id="resetInvalid" hidden>
        <p class="reset-invalid-text">El enlace no es válido o ya expiró.</p>
        <a class="btn btn-secondary login-submit" href="/admin.html">Pedir otro enlace</a>
      </div>

      <p id="resetStatus" class="login-notice" role="status"></p>

      <div class="login-back">
        <a href="/">← Volver a la tienda</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
