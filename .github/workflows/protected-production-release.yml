name: Protected production release preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: protected-production-release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Revalidate exact release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR, exact-SHA checks, and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          head="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          merged="$(jq -r '.merged' <<<"$pr")"
          mergeable="$(jq -r '.mergeable' <<<"$pr")"

          [[ "$state" == "open" && "$base" == "main" && "$merged" == "false" ]] || { echo "PR must be open, unmerged, and target main."; exit 1; }
          [[ "$head" == "$EXPECTED_SHA" && "$head_ref" == "$EXPECTED_REF" ]] || { echo "PR head changed during validation."; exit 1; }
          [[ "$mergeable" != "false" ]] || { echo "GitHub reports merge conflicts; resolve them before release."; exit 1; }

          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" | jq -s 'add')"
          db_changed="$(jq '[.[] | select(.filename | test("^(supabase/|.*\\.sql$|.*schema.*|.*migration.*)"))] | length > 0' <<<"$files")"
          customer_changed="$(jq '[.[] | select(.filename | test("^(public/|src/|app/|pages/|components/|js/|css/)|(^|/)(index|shop|catalog).*\\.html$"))] | length > 0' <<<"$files")"

          ready=false
          for attempt in $(seq 1 40); do
            checks="$(gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/check-runs?per_page=100")"
            total="$(jq '.total_count' <<<"$checks")"

            quality="$(jq '[.check_runs[] | select(.name == "Tests and static build check" and .status == "completed" and .conclusion == "success")] | length' <<<"$checks")"
            security="$(jq '[.check_runs[] | select(.name == "Dependency vulnerability audit" and .status == "completed" and .conclusion == "success")] | length' <<<"$checks")"
            pending="$(jq '[.check_runs[] | select((.name | test("Revalidate exact release candidate"; "i") | not) and (.status != "completed" or (.conclusion != "success" and ((.name != "Supabase Preview") or .conclusion != "skipped" or $db_changed))))] | length' --argjson db_changed "$db_changed" <<<"$checks")"
            failures="$(jq '[.check_runs[] | select((.name | test("Revalidate exact release candidate"; "i") | not) and .status == "completed" and .conclusion != "success" and ((.name != "Supabase Preview") or .conclusion != "skipped" or $db_changed))] | length' --argjson db_changed "$db_changed" <<<"$checks")"

            if [[ "$failures" -gt 0 ]]; then
              echo "One or more exact-SHA checks failed:"
              jq -r '.check_runs[] | select((.name | test("Revalidate exact release candidate"; "i") | not) and .status == "completed" and .conclusion != "success") | [.name,.conclusion,.html_url] | @tsv' <<<"$checks"
              exit 1
            fi

            browser_ok=true
            if [[ "$customer_changed" == "true" ]]; then
              browser_ok="$(jq -r '[.check_runs[] | select((.name | test("browser|customer journey"; "i")) and .status == "completed" and .conclusion == "success")] | length > 0' <<<"$checks")"
            fi

            if [[ "$total" -gt 0 && "$quality" -gt 0 && "$security" -gt 0 && "$pending" -eq 0 && "$browser_ok" == "true" ]]; then
              ready=true
              break
            fi
            echo "Waiting for exact-SHA checks to finish (attempt $attempt/40; quality=$quality security=$security pending=$pending browser=$browser_ok)."
            sleep 30
          done

          [[ "$ready" == "true" ]] || { echo "Timed out or required exact-SHA evidence is missing. Do not merge."; exit 1; }

          statuses="$(gh api "repos/$GH_REPO/commits/$EXPECTED_SHA/status")"
          contexts="$(jq '.statuses | length' <<<"$statuses")"
          state_status="$(jq -r '.state' <<<"$statuses")"
          [[ "$contexts" -eq 0 || "$state_status" == "success" ]] || { echo "Commit status contexts are not successful: $state_status"; exit 1; }

          echo "READY TO MERGE MANUALLY: PR #$PR_NUMBER at $EXPECTED_SHA passed exact-SHA release preflight."
          echo "This workflow is read-only. It cannot merge, push, deploy, run migrations, or modify production."
          echo "The repository owner must review the PR and click Merge in GitHub. That merge may trigger Cloudflare production deployment."
