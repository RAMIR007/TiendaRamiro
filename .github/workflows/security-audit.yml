name: RamiroX Market scheduled security audit

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ramirox-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
