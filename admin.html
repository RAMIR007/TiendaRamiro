<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | RX Store Demo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Pantalla de Login -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Acceso Administrativo</h2>
      <p>Ingresa la contraseña para gestionar el catálogo local. (Por defecto: <code>admin123</code>)</p>
      
      <form id="loginForm">
        <div class="form-group" style="text-align: left;">
          <input type="password" id="adminPassword" class="form-control" placeholder="Contraseña de acceso" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
          Ingresar al Panel
        </button>
      </form>

      <div style="margin-top: 1.5rem;">
        <a href="index.html" style="color: var(--text-muted); font-size: 0.82rem; text-decoration: none;">← Volver a la Tienda</a>
      </div>
    </div>
  </div>

  <!-- Panel Principal de Administración -->
  <div id="adminLayout" class="admin-layout">
    <header class="admin-header">
      <div class="admin-title-wrap">
        <h1>Gestión de Catálogo</h1>
        <span id="adminProdCount">Cargando inventario...</span>
      </div>

      <div class="admin-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nuevo Producto
        </button>
        <button class="btn btn-secondary" onclick="exportJSON()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Exportar JSON
        </button>
        <button class="btn btn-secondary" onclick="resetDefaults()" title="Restablecer a productos demo de muestra">
          Restablecer
        </button>
        <a href="index.html" class="btn btn-secondary" target="_blank">
          Ver Tienda ↗
        </a>
        <button class="btn btn-danger" onclick="handleLogout()">
          Cerrar Sesión
        </button>
      </div>
    </header>

    <!-- Tabla de Productos -->
    <div class="products-table-card">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Inyectado por js/admin.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Formulario Producto (Crear / Editar) -->
  <div id="formModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 600px; padding: 2rem;">
      <h2 id="formModalTitle" style="margin-bottom: 1.25rem;">Añadir Producto</h2>
      
      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="form-group">
          <label>Nombre del Producto *</label>
          <input type="text" id="pName" class="form-control" required placeholder="ej. Auriculares Bluetooth TWS">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Categoría *</label>
            <select id="pCategory" class="form-control" required>
              <option value="tecnologia">Tecnología</option>
              <option value="moda">Moda & Calzado</option>
              <option value="hogar">Hogar & Accesorios</option>
            </select>
          </div>

          <div class="form-group">
            <label>Precio en USD ($) *</label>
            <input type="number" id="pPrice" class="form-control" min="0" step="0.01" required placeholder="ej. 25">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>Stock Disponible *</label>
            <input type="number" id="pStock" class="form-control" min="0" required placeholder="ej. 10">
          </div>

          <div class="form-group">
            <label>Distintivo / Badge (opcional)</label>
            <input type="text" id="pBadge" class="form-control" placeholder="ej. Más Vendido, Nuevo, Oferta">
          </div>
        </div>

        <div class="form-group">
          <label>URLs de Imágenes (separadas por comas)</label>
          <input type="text" id="pImages" class="form-control" placeholder="https://..., https://...">
        </div>

        <div class="form-group">
          <label>Variantes / Tallas / Opciones (separadas por comas)</label>
          <input type="text" id="pVariants" class="form-control" placeholder="ej. Negro, Blanco ó Talla S, Talla M">
        </div>

        <div class="form-group">
          <label>Descripción del Producto</label>
          <textarea id="pDesc" class="form-control" rows="3" placeholder="Detalles, materiales, especificaciones técnicas..."></textarea>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeFormModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
